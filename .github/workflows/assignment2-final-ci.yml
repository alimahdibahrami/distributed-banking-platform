name: Assignment 2 - Final CI Gates

on:
  push:
    branches:
      - main
      - feature/bonus10e-source-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-compose:
    name: Python regression and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check source and release invariants
        run: python scripts/assignment2_release_gate.py
      - name: Compile source files
        run: python -m compileall -q bank_platform scripts labs/distributed-banking-b10e5-crash-lab/bank_platform labs/distributed-banking-b10e5-crash-lab/scripts
      - name: Regression - core and integrated crash lab
        run: python -m pytest -q tests labs/distributed-banking-b10e5-crash-lab/tests --disable-warnings
      - name: Validate core Compose and published phase8a release Compose
        env:
          SHARD_A_DB_PASSWORD: ci_only_not_real_a
          SHARD_B_DB_PASSWORD: ci_only_not_real_b
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.release.yaml config --quiet
          docker compose -f compose.release.yaml config --images
      - name: Validate isolated three-shard lab Compose
        env:
          LAB_A_PASSWORD: ci_only_not_real_a
          LAB_B_PASSWORD: ci_only_not_real_b
          LAB_C_PASSWORD: ci_only_not_real_c
        run: docker compose -f labs/distributed-banking-b10e5-crash-lab/compose.b10e5.yaml --profile post --profile ops config --quiet

  image-build:
    name: Build core application image (no push)
    runs-on: ubuntu-latest
    needs: source-and-compose
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build core image
        run: docker build --pull -t assignment2-core-ci:${{ github.sha }} .
      - name: Import smoke test
        run: |
          docker run --rm --entrypoint python assignment2-core-ci:${{ github.sha }} -c "import bank_platform.gateway.app,bank_platform.coordinator.app,bank_platform.shard.app;print('CORE_IMPORT_SMOKE_PASS')"
      - name: Scope note
        run: echo 'PASS here proves core image build and imports, not zero-downtime resharing or a production deployment.'
