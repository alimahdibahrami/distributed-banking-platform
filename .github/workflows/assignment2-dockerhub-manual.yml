name: Assignment 2 - Manual Docker Hub Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Recheck source before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/assignment2_release_gate.py
      - run: python -m pytest -q tests labs/distributed-banking-b10e5-crash-lab/tests --disable-warnings

  publish:
    name: Build and publish core image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verification
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate immutable commit-specific tag
        id: tag
        shell: bash
        run: |
          echo "value=a2-final-$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Docker Hub credentials
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push tested core image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/distributed-banking-platform:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish immutable reference to run summary
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          OWNER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "### Docker Hub release" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${OWNER}/distributed-banking-platform:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest reference: ${OWNER}/distributed-banking-platform@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'This is the core application image; the 3-shard bonus lab uses extra bind mounts, Compose and SQL.' >> "$GITHUB_STEP_SUMMARY"
